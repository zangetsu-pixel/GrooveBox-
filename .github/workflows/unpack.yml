name: Unpack uploaded zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip files
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found, nothing to do"
            exit 0
          fi
          for f in "${zips[@]}"; do
            echo "Unpacking $f"
            unzip -o "$f" -x ".github/*" "__MACOSX/*"
            git rm -f "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack ${zips[*]}" || echo "Nothing to commit"
          git push
