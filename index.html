<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>GrooveBox</title>
<style>
:root{--acc:#7cf5c8}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#f2f2f2;font:16px system-ui,sans-serif;max-width:560px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;letter-spacing:1px;margin-bottom:12px}
.card{background:#101010;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:14px}
button,.btn,select,input[type=text]{background:#1a1a1a;color:#f2f2f2;border:1px solid #2c2c2c;border-radius:12px;padding:10px 14px;font-size:15px}
button:active{background:#262626}
.on{background:var(--acc)!important;color:#000!important;border-color:var(--acc)!important}
#np{font-size:18px;min-height:24px;margin:8px 0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--acc)}
#t{display:flex;justify-content:space-between;color:#8a8a8a;font-size:13px}
#cv{display:block;margin:0 auto;border-radius:18px;width:170px;height:170px}
#vz{width:100%;height:60px;display:block;margin-top:10px}
#ly{text-align:center;min-height:70px;margin-top:8px;color:#777}#ly b{display:block;color:var(--acc);font-size:19px;margin:4px 0}
#list{max-height:200px;overflow:auto;margin-top:8px}
.it{padding:9px 6px;border-bottom:1px solid #1c1c1c;color:#bbb;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.cur{color:var(--acc)}
.band{display:grid;grid-template-columns:48px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:14px;color:#aaa}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
small{color:#777}
</style></head><body>
<h1>GROOVEBOX</h1>
<div class="card">
 <canvas id="cv" width="340" height="340"></canvas>
 <div id="np">Pick some songs to start</div>
 <input type="range" id="seek" value="0" min="0" max="1000"><div id="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
 <div class="row"><button id="shf">🔀</button><button id="prev">⏮</button><button id="pp" style="padding:12px 28px">▶</button><button id="next">⏭</button><button id="rpt">🔁</button></div>
 <canvas id="vz" width="500" height="60"></canvas>
 <div id="ly"><small>Load a .lrc file for synced lyrics</small></div>
 <div class="row"><label class="btn" for="f">＋ Songs</label><input id="f" type="file" accept="audio/*" multiple hidden>
 <label class="btn" for="lrc">🎤 Lyrics</label><input id="lrc" type="file" accept=".lrc,.txt" hidden></div>
</div>
<div class="card"><input type="text" id="srch" placeholder="Search queue" style="width:100%"><div id="list"><small>Queue is empty</small></div>
 <div class="row"><span>Sleep</span><select id="slp"><option value="0">Off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select><small id="slpt"></small></div></div>
<div class="card"><b>Sound</b>
 <div class="band"><span>Pre</span><input type="range" id="pre" min="-12" max="6" step="0.5" value="0"><span id="pre_v">0</span></div>
 <div id="eq"></div>
 <div class="band"><span>Speed</span><input type="range" id="spd" min="0.5" max="1.5" step="0.05" value="1"><span id="spd_v">1</span></div>
 <div class="tg"><button id="mud">Anti-mud</button><button id="sib">Sibilance</button><button id="cf">Crossfeed</button><button id="warm">Tube warmth</button><button id="kar">Karaoke</button><button id="kp">Keep pitch</button><button id="rs">Reset</button></div>
</div>
<div class="card"><b>Theme</b><div class="tg"><button data-t="auto">Auto (cover)</button><button data-t="#7cf5c8">Mint</button><button data-t="#b388ff">Violet</button><button data-t="#ffb347">Amber</button><button data-t="#ff6b8b">Rose</button></div></div>
<audio id="a" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),a=$('#a');
const B=[31,62,125,250,500,1000,2000,4000,8000,16000],BL=['31','62','125','250','500','1k','2k','4k','8k','16k'];
let q=[],i=-1,ctx,N={},url,L=[],sh=0,rp=0,sl,cov='#7cf5c8';
let S={pre:0,eq:B.map(()=>0),mud:0,sib:0,cf:0,warm:0,kar:0,spd:1,kp:1,th:'auto'};
try{Object.assign(S,JSON.parse(localStorage.getItem('gb2')||'{}'));if(S.eq.length!=B.length)S.eq=B.map(()=>0)}catch(e){}
const save=()=>{try{localStorage.setItem('gb2',JSON.stringify(S))}catch(e){}};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function init(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 const src=ctx.createMediaElementSource(a);
 N.pre=ctx.createGain();
 N.eq=B.map((f,k)=>{const n=ctx.createBiquadFilter();n.type=k==0?'lowshelf':k==9?'highshelf':'peaking';n.frequency.value=f;n.Q.value=1.1;return n});
 N.mud=ctx.createBiquadFilter();N.mud.type='peaking';N.mud.frequency.value=300;N.mud.Q.value=1;
 N.sib=ctx.createBiquadFilter();N.sib.type='peaking';N.sib.frequency.value=7200;N.sib.Q.value=2;
 let n=src;[N.pre,...N.eq,N.mud,N.sib].forEach(x=>{n.connect(x);n=x});
 const mix=ctx.createGain(),sh2=ctx.createWaveShaper(),cu=new Float32Array(1024);
 for(let k=0;k<1024;k++){const x=k/512-1;cu[k]=Math.tanh(2.5*x)+0.1*x*x}
 sh2.curve=cu;sh2.oversample='2x';N.dry=ctx.createGain();N.wet=ctx.createGain();
 n.connect(N.dry);N.dry.connect(mix);n.connect(sh2);sh2.connect(N.wet);N.wet.connect(mix);
 const sp=ctx.createChannelSplitter(2),mg=ctx.createChannelMerger(2);N.x=[];N.d=[];N.k=[];
 mix.connect(sp);
 [0,1].forEach(c=>{
  const d=ctx.createGain();sp.connect(d,c);d.connect(mg,0,c);N.d.push(d);
  const kg=ctx.createGain();kg.gain.value=0;sp.connect(kg,c);kg.connect(mg,0,0);kg.connect(mg,0,1);N.k.push(kg);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
  const dl=ctx.createDelay();dl.delayTime.value=0.0003;
  const x=ctx.createGain();x.gain.value=0;
  sp.connect(lp,c);lp.connect(dl);dl.connect(x);x.connect(mg,0,1-c);N.x.push(x);
 });
 N.an=ctx.createAnalyser();N.an.fftSize=128;mg.connect(N.an);N.an.connect(ctx.destination);
 apply();viz();
}
function apply(){
 $('#pre_v').textContent=S.pre;$('#pre').value=S.pre;$('#spd_v').textContent=S.spd;$('#spd').value=S.spd;
 document.querySelectorAll('.eqs').forEach((e,k)=>{e.value=S.eq[k];$('#ev'+k).textContent=S.eq[k]});
 ['mud','sib','cf','warm','kar','kp'].forEach(k=>$('#'+k).classList.toggle('on',!!S[k]));
 a.defaultPlaybackRate=S.spd;a.playbackRate=S.spd;a.preservesPitch=a.webkitPreservesPitch=a.mozPreservesPitch=!!S.kp;
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==S.th));
 document.documentElement.style.setProperty('--acc',S.th=='auto'?cov:S.th);
 if(!ctx)return;
 N.pre.gain.value=Math.pow(10,S.pre/20);
 N.eq.forEach((n,k)=>n.gain.value=S.eq[k]);
 N.mud.gain.value=S.mud?-4:0;N.sib.gain.value=S.sib?-3.5:0;
 N.dry.gain.value=S.warm?0.6:1;N.wet.gain.value=S.warm?0.5:0;
 N.d.forEach(d=>d.gain.value=S.kar?0:1);N.k[0].gain.value=S.kar?.5:0;N.k[1].gain.value=S.kar?-.5:0;
 N.x.forEach(x=>x.gain.value=S.cf&&!S.kar?0.35:0);
}
B.forEach((f,k)=>{
 const d=document.createElement('div');d.className='band';
 d.innerHTML=`<span>${BL[k]}</span><input class="eqs" type="range" min="-12" max="12" step="0.5" value="0"><span id="ev${k}">0</span>`;
 d.querySelector('input').oninput=e=>{S.eq[k]=+e.target.value;apply();save()};
 $('#eq').appendChild(d);
});
$('#pre').oninput=e=>{S.pre=+e.target.value;apply();save()};
$('#spd').oninput=e=>{S.spd=+e.target.value;apply();save()};
['mud','sib','cf','warm','kar','kp'].forEach(k=>$('#'+k).onclick=()=>{S[k]=S[k]?0:1;apply();save()});
$('#rs').onclick=()=>{S=Object.assign(S,{pre:0,eq:B.map(()=>0),mud:0,sib:0,cf:0,warm:0,kar:0,spd:1,kp:1});apply();save()};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.th=b.dataset.t;apply();save()});
function cover(t){
 let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;
 const hue=h%360,c=$('#cv').getContext('2d'),g=c.createLinearGradient(0,0,340,340);
 g.addColorStop(0,`hsl(${hue},70%,45%)`);g.addColorStop(1,`hsl(${(hue+60)%360},70%,15%)`);
 c.fillStyle=g;c.fillRect(0,0,340,340);
 c.fillStyle='rgba(255,255,255,.08)';for(let r=0;r<2;r++)for(let k=0;k<2;k++)if((h>>(r*2+k))&1)c.fillRect(k*170,r*170,170,170);
 c.font='120px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(['🎧','🎸','🎹','🥁','🎷','🎻','🌙','🔥','🌊','⚡'][h%10],170,175);
 cov=`hsl(${hue},85%,68%)`;apply();
}
function render(){
 const f=$('#srch').value.toLowerCase();$('#list').innerHTML=q.length?'':'<small>Queue is empty</small>';
 q.forEach((x,k)=>{if(f&&!x.name.toLowerCase().includes(f))return;const d=document.createElement('div');d.className='it'+(k==i?' cur':'');d.textContent=x.name.replace(/\.[^.]+$/,'');d.onclick=()=>load(k);$('#list').appendChild(d)});
}
$('#srch').oninput=render;
function load(k){
 if(k<0||k>=q.length)return;
 init();ctx.resume();
 if(url)URL.revokeObjectURL(url);
 i=k;url=URL.createObjectURL(q[k]);a.src=url;apply();a.play();L=[];$('#ly').innerHTML='<small>Load a .lrc file for synced lyrics</small>';
 const t=q[k].name.replace(/\.[^.]+$/,'');$('#np').textContent=t;cover(t);render();
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:'GrooveBox'});
}
function go(d){
 if(!q.length)return;
 if(sh&&q.length>1){let k;do{k=Math.floor(Math.random()*q.length)}while(k==i);load(k)}
 else load((i+d+q.length)%q.length);
}
$('#f').onchange=e=>{const had=q.length;q.push(...e.target.files);render();if(!had&&q.length)load(0);e.target.value=''};
$('#lrc').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;L=[];
 (await f.text()).split(/\r?\n/).forEach(l=>{const tx=l.replace(/\[[^\]]*\]/g,'').trim();[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)].forEach(m=>L.push([+m[1]*60+ +m[2],tx]))});
 L.sort((x,y)=>x[0]-y[0]);e.target.value='';
};
function lyr(){
 if(!L.length)return;let k=-1;for(let j=0;j<L.length;j++){if(L[j][0]<=a.currentTime)k=j;else break}
 const g=j=>(L[j]?L[j][1]:'')||'';$('#ly').innerHTML=`<small>${g(k-1)}</small><b>${g(k)||'♪'}</b><small>${g(k+1)}</small>`;
}
$('#pp').onclick=()=>{if(i<0){if(q.length)load(0);return}init();ctx.resume();a.paused?a.play():a.pause()};
$('#next').onclick=()=>go(1);
$('#prev').onclick=()=>a.currentTime>3?a.currentTime=0:go(-1);
$('#shf').onclick=e=>{sh=!sh;e.target.classList.toggle('on',sh)};
$('#rpt').onclick=e=>{rp=(rp+1)%3;e.target.textContent=rp==2?'🔂':'🔁';e.target.classList.toggle('on',rp>0)};
a.onplay=()=>$('#pp').textContent='⏸';a.onpause=()=>$('#pp').textContent='▶';
a.onended=()=>{if(rp==2)load(i);else if(sh||i+1<q.length)go(1);else if(rp==1)load(0)};
a.ontimeupdate=()=>{$('#cur').textContent=fmt(a.currentTime);$('#dur').textContent=fmt(a.duration);if(a.duration)$('#seek').value=a.currentTime/a.duration*1000;lyr()};
$('#seek').oninput=e=>{if(a.duration)a.currentTime=e.target.value/1000*a.duration};
$('#slp').onchange=e=>{clearTimeout(sl);const m=+e.target.value;$('#slpt').textContent=m?'pausing in '+m+' min':'';if(m)sl=setTimeout(()=>{a.pause();$('#slp').value=0;$('#slpt').textContent=''},m*60000)};
function viz(){
 const c=$('#vz'),x=c.getContext('2d'),d=new Uint8Array(N.an.frequencyBinCount);
 (function f(){requestAnimationFrame(f);N.an.getByteFrequencyData(d);x.clearRect(0,0,500,60);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc');
  const w=500/d.length;for(let k=0;k<d.length;k++){const h=d[k]/255*58;x.fillRect(k*w+1,60-h,w-2,h)}})();
}
if('mediaSession' in navigator){
 navigator.mediaSession.setActionHandler('play',()=>a.play());
 navigator.mediaSession.setActionHandler('pause',()=>a.pause());
 navigator.mediaSession.setActionHandler('nexttrack',()=>go(1));
 navigator.mediaSession.setActionHandler('previoustrack',()=>go(-1));
}
apply();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
